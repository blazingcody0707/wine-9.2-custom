name: Build Winlator Wine 9.2 Custom for Mobox WoW64

on:
  workflow_dispatch: # Allows you to trigger the build manually from GitHub

jobs:
  build-wine:
    runs-on: ubuntu-24.04 # Matches the 'noble' Ubuntu distribution requested

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Ubuntu Noble Source Repositories
        run: |
          # Use tee -a to safely append with sudo permissions
          echo "deb-src http://ubuntu.com noble main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb-src http://ubuntu.com noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update

      - name: Install Wine Build Dependencies
        run: |
          # Enable 32-bit architecture for compiling WoW64 structural parts
          sudo dpkg --add-architecture i386
          sudo apt-get update
          
          # Force install core build tools alongside Wine build-deps
          sudo apt-get install -y build-essential ccache git gettext libx11-dev libxext-dev
          sudo apt-get build-dep -y wine

      - name: Clone Brunodev Winlator Wine Source
        run: |
          # Cloning the repository. (Verify if brunodev's specific fork or branch name differs)
          git clone --depth 1 https://github.com/brunodev85/wine-9.2-custom wine-source
          cd wine-source
          # If the wine source sits in a specific tag/subfolder, navigate or checkout here:
          # git checkout wine-9.2-custom

      - name: Configure and Compile Wine for Mobox WoW64
        run: |
          cd wine-source
          mkdir build && cd build
          
          # Enable WoW64 mode using the upstream experimental structure favored by Mobox
          ../configure \
            --enable-archs=i386,x86_64 \
            --disable-tests \
            --without-oss \
            --prefix=$GITHUB_WORKSPACE/wine-wow64-dist
            
          make -j$(nproc)
          make install

      - name: Package and Upload Artifacts
        # Fixed the error: changed 'actions/artifacts' to 'actions/upload-artifact'
        uses: actions/upload-artifact@v4
        with:
          name: winlator-wine-9.2-mobox-wow64
          path: ${{ github.workspace }}/wine-wow64-dist/
          retention-days: 7
