
name: Build Custom Wine 9.2 WoW64 for Mobox

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build-wine:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Architecture and APT Source Dependencies
        run: |
          sudo dpkg --add-architecture i386
          
          # Enable source repositories (deb-src) required for apt build-dep
          sudo echo "deb-src archive.ubuntu.com noble main restricted universe multiverse" >> /etc/apt/sources.list
         # apt update
          sudo apt-get update

      - name: Install Wine Dependencies via build-dep
        run: |
          # Prevent interactive prompts from blocking the CI runner
          export DEBIAN_FRONTEND=noninteractive
          
          # Install general build essentials first
          sudo apt-get install -y build-essential git flex bison mingw-w64
          
          # Pull build dependencies for native wine packages
          sudo apt-get build-dep -y wine

      - name: Clone brunodev85's Custom Wine 9.2
        run: |
          git clone --depth 1 https://github.com/blazingcody0707/wine-9.2-custom wine-source
          cd wine-source
          echo "WINE_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Configure and Build New WoW64 Wine
        run: |
          cd wine-source
          mkdir build && cd build
          
          # --enable-archs=i386,x86_64 triggers Wine's modern New WoW64 compilation path
          ../configure \
            --enable-archs=i386,x86_64 \
            --prefix=$GITHUB_WORKSPACE/wine-dist \
            --with-x \
            --with-gstreamer \
            --with-vulkan
            
          # Compile using all available CPU threads
          make -j$(nproc)
          
          # Install the binary output into our isolated prefix directory
          make install

      - name: Package Build for Mobox
        run: |
          cd $GITHUB_WORKSPACE
          # Compress the compiled binary tree into a tarball structure friendly for Mobox environments
          tar -cJf wine-9.2-custom-wow64.tar.xz -C wine-dist .

      - name: Upload Wine Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-9.2-custom-wow64-${{ env.WINE_COMMIT }}
          path: wine-9.2-custom-wow64.tar.xz
          retention-days: 7
