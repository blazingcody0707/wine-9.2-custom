name: Build Custom Winlator Wine 9.2 WoW64 for Mobox

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Ubuntu Noble Repositories and Sources
        run: |
          # Safely append the Noble main source configurations requested
          sudo sh -c 'echo "deb-src http://ubuntu.com noble main restricted universe multiverse" >> /etc/apt/sources.list'
          sudo sh -c 'echo "deb-src http://ubuntu.com noble-updates main restricted universe multiverse" >> /etc/apt/sources.list'
          
          # Update the package index
          sudo apt-get update

      - name: Install Wine Build Dependencies
        run: |
          # Install general build essential utilities 
          sudo apt-get install -y build-essential git bison flex mingw-w64
          
          # Run apt build-dep targeting wine
          sudo apt-get build-dep -y wine

      - name: Clone Brunodev Custom Wine Repository
        run: |
          git clone --depth 1 https://github.com/blazingcody0707/wine-9.2-custom wine-source

      - name: Configure Wine for New WoW64
        run: |
          mkdir wine-build
          cd wine-build
          # --enable-win64 paired with --enable-archs=i386,x86_64 invokes the experimental structural WoW64 mode 
          ../wine-source/configure \
            --prefix=/opt/wine-wow64 \
            --enable-win64 \
            --enable-archs=i386,x86_64 \
            --with-x \
            --with-gstreamer

      - name: Compile Wine
        run: |
          cd wine-build
          # Build utilizing all available runner CPU cores
          make -j$(nproc)

      - name: Package Wine Build Assets
        run: |
          cd wine-build
          # Perform fake root install into a local workspace directory
          mkdir -p ../wine-dist
          make install DESTDIR=$(pwd)/../wine-dist
          
          # Compress binary components explicitly for Mobox container portability
          cd ../wine-dist
          tar -cJf ../wine-9.2-custom-wow64-mobox.tar.xz .

      - name: Upload Wine Build Artifact
        uses: actions/artifacts@v4
        with:
          name: wine-9.2-custom-wow64-mobox
          path: wine-9.2-custom-wow64-mobox.tar.xz
